# Scheduled jobs run here, not on Vercel: the Hobby plan only allows daily crons,
# and a full import takes longer than a Hobby function may run.
# They talk to the same hosted Postgres as the site (DATABASE_URL secret).
name: Jobs

on:
  schedule:
    - cron: "5 * * * *" # every hour: import every board, Workable's last 2 days (a full scan when due), then alerts
    - cron: "30 4 * * *" # daily: find new employer boards
    - cron: "0 9 * * *" # daily: renewal reminders, end pauses
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [ingest, full, discover, alerts, reminders, rescore]
        default: ingest

concurrency:
  group: jobs-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NODE_ENV: production
    steps:
      - name: Pick the job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "30 4 * * *") job=discover ;;
            "0 9 * * *") job=reminders ;;
            "") job="${{ inputs.job }}" ;;
            *) job=ingest ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Stop if the database is not set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL secret (hosted Postgres) before scheduled jobs can run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ steps.pick.outputs.job }}
        run: pnpm job ${{ steps.pick.outputs.job }}
